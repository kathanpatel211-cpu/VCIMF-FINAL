<title>VanDrishti Sub-division 2</title>
<link rel="artifact-thumbnail" href="thumb.jpg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@600&display=swap">
<style>
/* Layout concept: a night-forest command centre. The sub-division is a live 3D field of pixel
   columns (one per 10 ha block); everything else sits on quiet glass panels around it.
   Single committed dark look, matching the Van Punarjeevan atlas covers. */
:root {
  color-scheme: dark;
  --night: #040b08; --deep: #08160f; --panel: #0d2017; --panel-2: #112a1f; --raise: #163527;
  --line: rgba(196, 232, 210, 0.10); --line-2: rgba(196, 232, 210, 0.20);
  --ink: #eef6f0; --muted: #a3baac; --faint: #6f897a;
  --gold: #f6c46a; --ember: #f46036; --mint: #9be3b6;
  --ok: #4fd38b; --ok-soft: rgba(79, 211, 139, 0.14); --warn: #f6b73c; --warn-soft: rgba(246, 183, 60, 0.14);
  --bad: #ff6f5e; --bad-soft: rgba(255, 111, 94, 0.14); --info: #74b4ff; --info-soft: rgba(116, 180, 255, 0.14);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-deva: "Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif;
  --r: 18px; --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  background: radial-gradient(1100px 620px at 82% -8%, rgba(31, 110, 72, 0.35), transparent 62%),
    radial-gradient(900px 520px at -10% 110%, rgba(246, 96, 54, 0.10), transparent 60%), var(--night);
  background-attachment: fixed; -webkit-font-smoothing: antialiased; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: linear-gradient(rgba(196, 232, 210, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(196, 232, 210, .025) 1px, transparent 1px);
  background-size: 28px 28px; mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--night); }
#app { position: relative; z-index: 1; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.1; font-weight: 700; }
h2 { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h2 small { color: var(--faint); font-family: var(--font-ui); font-weight: 500; font-size: 12px; }
p { margin: 0; }
a { color: var(--mint); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin-inline: auto; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--gold); }
.hint { color: var(--muted); font-size: 12.5px; }
.err { color: var(--bad); font-size: 13px; font-weight: 600; }
.okm { color: var(--ok); font-size: 13px; font-weight: 600; }
.grid { display: grid; gap: 16px; align-content: start; }
.grid > * { min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1060px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main, .g3 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) { .g2, .g4 { grid-template-columns: minmax(0, 1fr); } }
.card { background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .015)), var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line-2); background: var(--raise); color: var(--ink); border-radius: 12px; padding: 9px 15px; font-weight: 600; cursor: pointer; font-size: 13.5px; transition: transform .15s, background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); border-color: var(--mint); }
.btn.gold { background: linear-gradient(135deg, #ffd88a, #f0a52a); color: #2a1a00; border-color: transparent; box-shadow: 0 10px 28px rgba(240, 165, 42, .28); }
.btn.ghost { background: transparent; }
.btn.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); color: #ffd2cc; }
.btn.big { padding: 13px 20px; font-size: 15px; border-radius: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.c-g { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.c-a { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.c-r { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.c-i { background: var(--info-soft); color: var(--info); border-color: color-mix(in srgb, var(--info) 35%, transparent); }
.c-x { background: rgba(246, 196, 106, .14); color: var(--gold); border-color: rgba(246, 196, 106, .4); }
.c-s { background: rgba(255, 255, 255, .06); color: var(--muted); border-color: var(--line-2); }
.rdot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }

/* ---------- login ---------- */
.login { position: relative; min-height: 100vh; overflow: hidden; display: grid; }
#field-login { position: absolute; inset: 0; }
#field-login canvas { display: block; }
.login .veil { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(4, 11, 8, .95) 0%, rgba(4, 11, 8, .84) 44%, rgba(4, 11, 8, .1) 72%), linear-gradient(0deg, rgba(4, 11, 8, .85), transparent 35%); }
.login .inner { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 470px); gap: 40px; align-items: center; padding-block: 34px; width: 100%; pointer-events: none; }
.login .inner > * { pointer-events: auto; }
@media (max-width: 980px) { .login .inner { grid-template-columns: minmax(0, 1fr); } .login .veil { background: linear-gradient(180deg, rgba(4, 11, 8, .55), rgba(4, 11, 8, .93) 46%); } }
.wordmark { display: flex; gap: 14px; align-items: center; }
.wordmark b { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1; }
.wordmark span { color: var(--muted); font-size: 12.5px; }
.deva { font-family: var(--font-deva); }
.logo { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(140deg, #1f7a4f, #08291a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 10px 30px rgba(0, 0, 0, .4); flex: none; }
.brandblock { display: grid; gap: 26px; max-width: 640px; }
.brandblock h1 { font-size: clamp(34px, 5vw, 62px); line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; }
.grad { background: linear-gradient(100deg, var(--gold), var(--ember) 60%, #ff9fb0); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brandblock p { color: #c6d8cc; font-size: 15.5px; max-width: 56ch; }
.statsrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line-2); padding-top: 16px; }
.statsrow div { display: grid; gap: 2px; font-size: 12px; color: var(--muted); padding-right: 10px; }
.statsrow b { font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 28px); color: var(--ink); font-weight: 700; }
@media (max-width: 520px) { .statsrow { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; } }
.flow3 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: #c6d8cc; }
.flow3 span { display: inline-flex; gap: 8px; align-items: center; }
.flow3 i { font-style: normal; font-weight: 800; font-size: 11px; padding: 4px 8px; border-radius: 8px; color: #fff; }
.flow3 .arrow { color: var(--faint); }
.signin { background: linear-gradient(180deg, rgba(20, 48, 35, .82), rgba(10, 26, 19, .9)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line-2); border-radius: 24px; padding: 24px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.signin h2 { font-size: 21px; }
.steplabel { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rolebtn { border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); border-radius: 14px; padding: 12px 10px; text-align: left; cursor: pointer; display: grid; gap: 6px; transition: border-color .2s, background .2s, transform .2s; }
.rolebtn:hover { transform: translateY(-2px); }
.rolebtn[aria-pressed="true"] { border-color: var(--gold); background: rgba(246, 196, 106, .09); box-shadow: 0 0 0 3px rgba(246, 196, 106, .15); }
.rolebtn b { font-family: var(--font-display); font-size: 15px; }
.rolebtn small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.rangepick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rangebtn { position: relative; overflow: hidden; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); border-radius: 14px; padding: 12px 12px 11px 16px; text-align: left; cursor: pointer; display: grid; gap: 3px; transition: border-color .2s, transform .2s, background .2s; }
.rangebtn::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--rc); }
.rangebtn:hover { transform: translateY(-2px); }
.rangebtn[aria-pressed="true"] { border-color: var(--rc); background: color-mix(in srgb, var(--rc) 12%, transparent); }
.rangebtn b { font-family: var(--font-display); font-size: 14.5px; }
.rangebtn small { color: var(--muted); font-size: 11.5px; }
.field { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
input, select, textarea { font: inherit; color: var(--ink); background: rgba(0, 0, 0, .28); border: 1px solid var(--line-2); border-radius: 11px; padding: 10px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246, 196, 106, .18); }
textarea { min-height: 80px; resize: vertical; }
select option { background: var(--panel); }
.go { border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 15px; cursor: pointer; color: #2a1a00; background: linear-gradient(135deg, #ffd88a, #f0a52a); box-shadow: 0 14px 34px rgba(240, 165, 42, .3); transition: transform .15s; font-family: var(--font-display); }
.go:hover { transform: translateY(-1px); }
.creds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 460px) { .roles { grid-template-columns: minmax(0, 1fr); } .creds { grid-template-columns: minmax(0, 1fr); } }

/* ---------- shell ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(4, 11, 8, .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
header .bar { display: flex; align-items: center; gap: 16px; padding-block: 10px; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 11px; }
.brand b { font-family: var(--font-display); font-size: 17px; font-weight: 800; display: flex; gap: 8px; align-items: baseline; }
.brand b .deva { font-size: 12px; color: var(--gold); font-weight: 600; }
.brand small { color: var(--faint); font-size: 11.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navwrap { position: relative; display: flex; gap: 2px; margin-inline: auto; padding: 4px; border-radius: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.navwrap::-webkit-scrollbar { display: none; }
.navwrap button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 12px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.navwrap button[aria-current="page"] { color: var(--ink); }
.navwrap .pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 10px; background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .06)); box-shadow: inset 0 0 0 1px var(--line-2); transition: left .3s cubic-bezier(.2, .8, .2, 1), width .3s cubic-bezier(.2, .8, .2, 1); }
.count { background: var(--ember); color: #fff; font-size: 10.5px; border-radius: 999px; padding: 1px 6px; font-weight: 800; }
.who { display: flex; gap: 10px; align-items: center; }
.who b { font-size: 13px; display: block; }
.who small { color: var(--faint); font-size: 11.5px; font-family: var(--font-num); }
.av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 11px; color: #fff; flex: none; }
.ghostbtn { border: 1px solid var(--line-2); background: none; border-radius: 10px; padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
@media (max-width: 1100px) { header .bar { flex-wrap: wrap; } .navwrap { order: 3; width: 100%; margin: 0; } .who > div:nth-child(2) { display: none; } }
@media (max-width: 700px) { header.top { position: static; } .brand small { display: none; } }
main { display: grid; gap: 18px; padding-block: 22px 10px; }
.rise > * { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
.rise > *:nth-child(2) { animation-delay: .06s; } .rise > *:nth-child(3) { animation-delay: .12s; } .rise > *:nth-child(4) { animation-delay: .18s; } .rise > *:nth-child(n+5) { animation-delay: .24s; }
@keyframes rise { from { transform: translateY(12px); opacity: .001; } to { transform: none; opacity: 1; } }
.pagehead { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
.pagehead p { color: var(--muted); margin-top: 6px; max-width: 70ch; }

/* ---------- hero with the 3D field ---------- */
.hero { position: relative; border-radius: 26px; overflow: hidden; border: 1px solid var(--line-2); min-height: 470px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  background: radial-gradient(700px 480px at 75% 30%, color-mix(in srgb, var(--rc, #1f7a4f) 26%, transparent), transparent 70%), linear-gradient(160deg, #0b2016, #050e0a); }
.hero .txt { position: relative; z-index: 2; padding: 30px; display: grid; gap: 16px; align-content: center; }
.hero .txt h1 { font-size: clamp(30px, 4vw, 50px); font-weight: 800; letter-spacing: -0.03em; }
.hero .txt h1 .rn { color: var(--rc, var(--mint)); }
.hero .txt p { color: #c6d8cc; max-width: 52ch; }
.hero .scene { position: relative; min-height: 470px; }
.hero .scene > div:first-child { position: absolute; inset: 0; }
.hero .scene canvas { display: block; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; background: rgba(0, 0, 0, .22); display: grid; gap: 1px; }
.fact b { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.fact span { color: var(--muted); font-size: 12px; }
.overlay-tl { position: absolute; z-index: 3; left: 14px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.overlay-bl { position: absolute; z-index: 3; left: 14px; right: 14px; bottom: 12px; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero .scene { min-height: 380px; } .hero .txt { padding: 22px; } }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line-2); backdrop-filter: blur(8px); }
.seg button { border: 0; background: none; color: var(--muted); padding: 6px 11px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .13); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid rgba(255, 255, 255, .18); }
.tip3d { position: absolute; z-index: 4; pointer-events: none; background: rgba(4, 11, 8, .9); border: 1px solid var(--line-2); color: var(--ink); border-radius: 10px; padding: 7px 10px; font-size: 12px; white-space: nowrap; box-shadow: var(--shadow); }
.rangechips { display: flex; flex-wrap: wrap; gap: 6px; }
.rangechips button { border: 1px solid var(--line-2); background: rgba(0, 0, 0, .35); backdrop-filter: blur(8px); color: var(--ink); border-radius: 999px; padding: 5px 11px 5px 9px; cursor: pointer; font-size: 12px; font-weight: 600; display: inline-flex; gap: 7px; align-items: center; }
.rangechips button[aria-pressed="true"] { border-color: var(--gold); background: rgba(246, 196, 106, .14); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; perspective: 900px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { position: relative; border-radius: 16px; padding: 14px 15px; background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .015)), var(--panel); border: 1px solid var(--line); display: grid; gap: 4px; align-content: start; transition: transform .25s; transform-style: preserve-3d; overflow: hidden; }
.kpi::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(240px 120px at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .08), transparent 70%); }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi b { font-family: var(--font-display); font-size: 27px; font-weight: 700; line-height: 1.1; }
.kpi small { color: var(--faint); font-size: 11.5px; }
.kpi.hl { border-color: rgba(246, 96, 54, .5); background: linear-gradient(180deg, rgba(246, 96, 54, .16), rgba(246, 96, 54, .03)), var(--panel); }
.kpirow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ring { width: 42px; height: 42px; flex: none; }
.ring .tr { fill: none; stroke: rgba(255, 255, 255, .1); stroke-width: 5; }
.ring .fg { fill: none; stroke: var(--ok); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }

/* ---------- range cards (command centre) ---------- */
.rcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .rcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .rcards { grid-template-columns: minmax(0, 1fr); } }
.rcard { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--line); padding: 16px; display: grid; gap: 11px; text-align: left; cursor: pointer; color: var(--ink);
  background: radial-gradient(260px 160px at 100% 0%, color-mix(in srgb, var(--rc) 22%, transparent), transparent 70%), var(--panel); transition: transform .2s, border-color .2s; }
.rcard:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--rc) 60%, transparent); }
.rcard .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rcard .nm b { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.rcard .nm b::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--rc); margin-right: 8px; }
.rcard dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0; }
.rcard dt { color: var(--faint); font-size: 11px; }
.rcard dd { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.rcard .pend { position: absolute; top: 14px; right: 14px; }
.stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, .06); }
.stack > div { height: 100%; transform-origin: left; animation: grow .9s cubic-bezier(.2, .8, .2, 1) both; }
.stack.tall { height: 18px; border-radius: 8px; }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }

/* ---------- pipeline, bars, lists ---------- */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------------- mock-drill examples ---------------- */
async function loadDemo() {
  if (Store.all().some((w) => w.demo)) { toast("The mock-drill examples are already loaded"); return; }
  const year = fyNow(), now = Date.now(), day = 864e5;
  const stages = [["APPROVED", "ACF"], ["DCF", "RET_RFO"], ["APPROVED", "DCF"], ["ACF", "APPROVED_DEV"]];
  const schemes = ["CAMPA", "State plan", "MGNREGA", "Nagar Van"];
  const smcSets = [["Suitable", ["Continuous contour trenches (CCT)", "Pits with saucers"], "Tank / check dam within 1 km"], ["Partly suitable", ["Staggered trenches", "Gully plugs / loose boulder checks"], "Well or borewell"],
    ["Suitable", ["Pits with saucers"], "Tanker only"], ["Suitable", ["Continuous contour trenches (CCT)", "Gully plugs / loose boulder checks", "Percolation pits / farm ponds"], "Rain-fed only"]];
  const iso = (d) => new Date(now - d * day).toISOString();
  const count = [0, 0, 0, 0];
  for (const s of SAMPLES) {
    const k = count[s.r]++, stage = stages[s.r][k] || "ACF", rfo = RMETA[s.r].rfo, ago = [26 - s.r * 3 - k * 7, 22 - s.r * 3 - k * 7, 14 - s.r * 2 - k * 5, 8 - s.r - k * 3].map((x) => Math.max(1, x));
    const mk = (role, action, note, d) => ({ at: iso(d), role, user: role === "RFO" ? rfo : ROLES[role].id, action, note });
    const features = [{ type: "Feature", properties: { name: s.name }, geometry: { type: "Polygon", coordinates: [s.coords] } }];
    const result = analyse(features), est = +(result.total * (k ? 0.97 : 1)).toFixed(2), vd = verdictOf(result, s.treat, est, s.r), smc = smcSets[(s.r + k) % 4];
    const id = RMETA[s.r].code + "-" + year + "-" + String(901 + k);
    const w = { id, demo: true, r: s.r, range: RMETA[s.r].name, name: s.name, beat: s.beat, scheme: schemes[(s.r + k) % 4], year, treat: s.treat, estArea: est, estCost: +(est * 0.52).toFixed(2), seedlings: s.treat === "SMC" ? null : Math.round(est * 1100),
      remarks: "Mock-drill example.", fileName: "example_" + RMETA[s.r].code.toLowerCase() + "_" + (k + 1) + ".kml", geom: { type: "FeatureCollection", features }, result, verdict: vd.v, reasons: vd.reasons, s12: vd.s12, s45: vd.s45, sPE: vd.sPE, sOut: vd.sOut, sOther: vd.sOther, matchPct: vd.matchPct,
      createdAt: iso(ago[0]), createdBy: rfo, model: APP.model, trail: [],
      rfoCert: { checks: RFO_CHECKS.map(() => true), smcSuit: smc[0], smcWorks: smc[1], water: smc[2], note: stage === "APPROVED_DEV" ? "Gullies feed the village tank; SMC will cut the silt inflow." : "Boundary walked with GPS on the date of inspection.", at: iso(ago[1]), by: rfo } };
    if (vd.v !== "g") w.rfoCert.just = stage === "APPROVED_DEV" ? "Catchment of the Golvada village tank: gullies carry silt into the tank every monsoon. SMC and drought-hardy planting will hold the soil." : "Gap between two earlier plantations of this beat; villagers have asked for the site to be closed and planted.";
    w.trail.push(mk("RFO", "Draft created", "KML " + w.fileName, ago[0]));
    w.trail.push(mk("RFO", "Certified and submitted to ACF", "FRPIM " + VERDICT[vd.v][0] + ", " + fp(vd.s12) + " in Phase 1-2 · SMC: " + smc[0] + " (" + smc[1].join(", ") + ")", ago[1]));
    const ok = ACF_CHECKS.map(() => true);
    if (["APPROVED", "DCF", "APPROVED_DEV"].includes(stage)) {
      w.acf = { checks: ok, inspected: k === 0, inspectedOn: k === 0 ? iso(ago[2] + 1) : null, just: vd.v !== "g" ? "Site inspected. The RFO's reason holds: the work protects the village tank catchment and links two existing plantations. Recommended despite lower FRPIM priority." : "", remarks: stage === "APPROVED_DEV" ? "Low FRPIM priority, but SMC here protects the catchment of the village tank downstream. RFO's SMC assessment confirmed at site." : "RFO certification checked. Phase 1-2 land; SMC works and rates in order.", at: iso(ago[2]), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Recommended to DCF", w.acf.remarks, ago[2]));
      if (stage === "APPROVED") { w.dcf = { decision: "Approved", remarks: "Approved. Take up SMC before the monsoon.", at: iso(ago[3]) }; w.trail.push(mk("DCF", "Approved by DCF", w.dcf.remarks, ago[3])); }
      if (stage === "APPROVED_DEV") { w.dcf = { decision: "Approved with recorded deviation", remarks: "Approved as catchment treatment for the village tank; deviation from FRPIM priority recorded.", at: iso(ago[3]) }; w.trail.push(mk("DCF", "Approved by DCF with recorded deviation", w.dcf.remarks, ago[3])); }
    }

      w.acf = { checks: [true, false, false], inspected: true, inspectedOn: iso(ago[2] + 1), remarks: "Most of this boundary is low-priority land. Shift it to the Phase 1-2 blocks of the same beat and resubmit.", at: iso(ago[2]), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Returned to RFO for further review", w.acf.remarks, ago[2]));
    }
    w.status = stage; w.updatedAt = w.trail[w.trail.length - 1].at;
    await Store.put(w);
  }

}

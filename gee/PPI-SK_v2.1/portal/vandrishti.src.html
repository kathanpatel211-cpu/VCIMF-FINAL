<style>
/*LEAFLET_CSS*/
/* Layout: VanDrishti. A night-forest login with the range rising in 3D; inside, a glass top bar, a dashboard hero with the live 3D range, tilting KPI tiles, and work files laid out as map panel + scrutiny column. */
:root {
  --bg: #f1f5f1; --bg-2: #e6eee7; --surface: #ffffff; --surface-2: #eef3ee; --glass: rgba(255,255,255,.72);
  --ink: #12201a; --muted: #586a5f; --line: #d3ddd5; --line-2: #bfcdc3;
  --forest: #0f3d2a; --canopy: #1d6b47; --moss: #3e8f62; --ochre: #d48a0a; --ochre-ink: #2b1b00; --ochre-soft: #fbefd6;
  --ok: #17803a; --ok-soft: #e0f2e5; --warn: #a65c00; --warn-soft: #fcecd2; --bad: #b4261c; --bad-soft: #fbe2df; --info: #1f62ad; --info-soft: #e1ecf9;
  --mapbg: #e7ede8; --shadow: 0 1px 2px rgba(15,61,42,.06), 0 8px 24px -12px rgba(15,61,42,.18);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-deva: "Noto Sans Devanagari", "Nirmala UI", "Mangal", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1511; --bg-2: #0f1d17; --surface: #132019; --surface-2: #1a2a22; --glass: rgba(16,29,23,.72);
  --ink: #e4eee7; --muted: #95aa9c; --line: #23362b; --line-2: #2f4639;
  --forest: #0a2a1d; --canopy: #2f9a66; --moss: #5fc18a; --ochre: #f0a52a; --ochre-ink: #2b1b00; --ochre-soft: #33260f;
  --ok: #5fcb84; --ok-soft: #12301e; --warn: #f0a94e; --warn-soft: #36270f; --bad: #f2786a; --bad-soft: #3a1915; --info: #82b6ef; --info-soft: #14253a;
  --mapbg: #15211b; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1511; --bg-2: #0f1d17; --surface: #132019; --surface-2: #1a2a22; --glass: rgba(16,29,23,.72);
  --ink: #e4eee7; --muted: #95aa9c; --line: #23362b; --line-2: #2f4639;
  --forest: #0a2a1d; --canopy: #2f9a66; --moss: #5fc18a; --ochre: #f0a52a; --ochre-ink: #2b1b00; --ochre-soft: #33260f;
  --ok: #5fcb84; --ok-soft: #12301e; --warn: #f0a94e; --warn-soft: #36270f; --bad: #f2786a; --bad-soft: #3a1915; --info: #82b6ef; --info-soft: #14253a;
  --mapbg: #15211b; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: radial-gradient(1200px 600px at 85% -10%, var(--bg-2), transparent 60%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--font-display); letter-spacing: -0.01em; }
:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
@keyframes sheen { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(212,138,10,.45); } 50% { box-shadow: 0 0 0 6px rgba(212,138,10,0); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.rise > * { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
.rise > *:nth-child(2) { animation-delay: .05s; } .rise > *:nth-child(3) { animation-delay: .1s; } .rise > *:nth-child(4) { animation-delay: .15s; }
.rise > *:nth-child(5) { animation-delay: .2s; } .rise > *:nth-child(6) { animation-delay: .25s; } .rise > *:nth-child(n+7) { animation-delay: .3s; }

/* ---------------- login: a committed night-forest scene in both themes ---------------- */
.login { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; color: #eaf4ed;
  background: radial-gradient(900px 500px at 20% 10%, #1b5a3c 0%, transparent 60%), radial-gradient(900px 600px at 90% 110%, #4a3208 0%, transparent 55%), #07130d; }
.login #terrain3d { position: absolute; inset: 0; }
.login #terrain3d canvas { display: block; }
.login .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,19,13,.94) 0%, rgba(7,19,13,.78) 30%, rgba(7,19,13,.12) 55%, rgba(7,19,13,.1) 66%, rgba(7,19,13,.7) 100%); pointer-events: none; }
@media (min-width: 901px) { .login #terrain3d { left: 26%; right: -6%; } }
.login .inner { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 440px); gap: 32px; align-items: center; padding-block: 36px; pointer-events: none; }
.login .inner > * { pointer-events: auto; }
@media (max-width: 900px) { .login .inner { grid-template-columns: minmax(0, 1fr); align-items: start; } .login .veil { background: linear-gradient(180deg, rgba(7,19,13,.55), rgba(7,19,13,.9) 60%); } }
.brandblock { display: grid; gap: 18px; align-self: stretch; align-content: space-between; }
.wordmark { display: flex; gap: 14px; align-items: center; }
.wordmark .logo { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: linear-gradient(140deg, #2f9a66, #0f3d2a); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 10px 30px -10px rgba(47,154,102,.8); }
.wordmark b { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1; }
.wordmark .deva { font-family: var(--font-deva); font-size: 14px; color: #f0c56b; display: block; margin-top: 4px; }
.hero h1 { font-size: clamp(34px, 5.2vw, 68px); font-weight: 800; line-height: 1.02; letter-spacing: -0.035em; max-width: 12ch; }
.hero h1 em { font-style: normal; background: linear-gradient(100deg, #f6c46a, #f0a52a 40%, #9be3b6 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { max-width: 50ch; color: #c5d8cb; font-size: 15.5px; margin: 14px 0 0; }
.hero .org { display: inline-flex; gap: 10px; align-items: center; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: #9fc9ad; margin-bottom: 14px; }
.hero .org::before { content: ""; width: 26px; height: 2px; background: #f0a52a; }
.flow3 { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
.flow3 span { display: inline-flex; gap: 8px; align-items: center; padding: 7px 12px 7px 7px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font-size: 13px; backdrop-filter: blur(6px); }
.flow3 i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 800; color: #fff; }
.flow3 .arrow { color: #f0a52a; }
.statsrow { display: flex; flex-wrap: wrap; gap: 26px; font-size: 12.5px; color: #9fc9ad; }
.statsrow b { display: block; font-family: var(--font-num); font-weight: 500; font-size: 22px; color: #eaf4ed; }
.legend3d { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: #b9cfc0; }
.legend3d span { display: inline-flex; gap: 6px; align-items: center; }
.legend3d i { width: 10px; height: 10px; border-radius: 2px; }
.signin { background: rgba(10,26,18,.62); border: 1px solid rgba(255,255,255,.12); border-radius: 20px; padding: 26px; display: grid; gap: 14px; backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.08); }
.signin h2 { font-size: 22px; }
.signin .hint { color: #a9c3b2; font-size: 12.5px; }
.rolecards { display: grid; gap: 8px; }
.rolecard { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; padding: 11px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 13px; background: rgba(255,255,255,.04); cursor: pointer; color: #eaf4ed; transition: transform .2s, border-color .2s, background .2s; }
.rolecard:hover { transform: translateY(-1px); border-color: rgba(240,165,42,.55); }
.rolecard[aria-pressed="true"] { border-color: #f0a52a; background: rgba(240,165,42,.10); box-shadow: 0 0 0 3px rgba(240,165,42,.15); }
.rolecard .av { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.rolecard b { display: block; font-size: 14px; }
.rolecard small { color: #a9c3b2; font-size: 12px; display: block; }
.rolecard code { font-family: var(--font-num); font-size: 11.5px; color: #f0c56b; }
.signin .field { color: #a9c3b2; }
.signin .field input { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); color: #eaf4ed; }
.signin .err { color: #ff9b8f; }
.go { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--ochre-ink);
  background: linear-gradient(100deg, #f6c46a, #f0a52a 50%, #f6c46a) 0 0 / 200% 100%; animation: sheen 6s linear infinite; box-shadow: 0 10px 30px -12px rgba(240,165,42,.8); }
.tagline { font-family: var(--font-display); font-weight: 600; letter-spacing: .02em; color: #f0c56b; font-size: 14px; }

/* ---------------- shared form bits ---------------- */
.field { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { font-weight: 400; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 11px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--canopy); box-shadow: 0 0 0 3px color-mix(in srgb, var(--canopy) 20%, transparent); outline: none; }
.field textarea { min-height: 80px; resize: vertical; }
.hint { font-size: 12.5px; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; }
.okm { color: var(--ok); font-size: 13px; }

/* ---------------- app shell ---------------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 1001; }
.top .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding-block: 10px; max-width: 1400px; margin: 0 auto; }
.brand { display: flex; gap: 11px; align-items: center; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(140deg, #2f9a66, #0f3d2a); flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.brand b { font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 11.5px; display: block; }
.brand .deva { font-family: var(--font-deva); color: var(--ochre); font-weight: 700; font-size: 12px; margin-left: 6px; }
.navwrap { display: flex; gap: 4px; align-items: center; overflow-x: auto; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; position: relative; max-width: 100%; }
.navwrap button { background: transparent; border: 0; color: var(--muted); padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13px; border-radius: 9px; white-space: nowrap; position: relative; z-index: 1; transition: color .2s; }
.navwrap button[aria-current="page"] { color: var(--ink); }
.navwrap .pill { position: absolute; top: 4px; bottom: 4px; border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); transition: left .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1); z-index: 0; }
.navwrap .count { background: var(--ochre); color: var(--ochre-ink); border-radius: 999px; padding: 0 7px; font-size: 11px; margin-left: 6px; font-weight: 700; animation: pulse 2.4s infinite; }
.who { display: flex; gap: 10px; align-items: center; }
.who .av { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 11.5px; color: #fff; }
.who b { display: block; font-size: 13px; }
.who small { color: var(--muted); font-size: 11.5px; }
@media (max-width: 700px) { .top { position: static; } .top .bar { gap: 8px; } .navwrap { order: 3; width: 100%; } .who small { display: none; } }
.ghostbtn { background: transparent; border: 1px solid var(--line-2); color: var(--ink); border-radius: 9px; padding: 7px 11px; cursor: pointer; font-size: 13px; }
main { padding-block: 20px 40px; display: grid; gap: 18px; max-width: 1400px; margin: 0 auto; }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.pagehead h1 { font-size: 26px; font-weight: 800; }
.pagehead p { margin: 4px 0 0; color: var(--muted); }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ochre); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.card > h2 { font-size: 15.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card > h2 small { font-family: var(--font-ui); font-weight: 500; color: var(--muted); font-size: 12.5px; letter-spacing: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 1000px) { .g2, .g3, .g-main { grid-template-columns: minmax(0, 1fr); } }

/* dashboard hero */
.herocard { position: relative; overflow: hidden; border-radius: 22px; color: #eaf4ed; min-height: 300px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  background: radial-gradient(700px 400px at 80% 20%, #1d5a3c, transparent 60%), radial-gradient(500px 300px at 10% 120%, #4a3208, transparent 60%), #08160f; box-shadow: 0 30px 60px -35px rgba(8,22,15,.9); }
@media (max-width: 900px) { .herocard { grid-template-columns: minmax(0, 1fr); } }
.herocard .txt { padding: 26px; display: grid; gap: 14px; align-content: center; position: relative; z-index: 1; }
.herocard h1 { font-size: clamp(24px, 3vw, 34px); font-weight: 800; line-height: 1.1; }
.herocard p { margin: 0; color: #b9cfc0; }
.herocard .scene { position: relative; min-height: 280px; }
.herocard .scene > div { position: absolute; inset: 0; }
.herocard .seg3 { position: absolute; right: 14px; top: 14px; z-index: 2; }
.herocard .legend3d { position: absolute; left: 16px; bottom: 12px; z-index: 2; }
.herocard .tip3d { position: absolute; z-index: 3; pointer-events: none; background: rgba(5,15,10,.85); border: 1px solid rgba(255,255,255,.15); color: #eaf4ed; border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; }
.btn { border: 1px solid transparent; background: var(--canopy); color: #fff; border-radius: 11px; padding: 10px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; transition: transform .15s, box-shadow .2s, background .2s; box-shadow: 0 8px 20px -12px var(--canopy); }
.btn:hover { transform: translateY(-1px); }
.btn.gold { background: linear-gradient(100deg, #f6c46a, #f0a52a); color: var(--ochre-ink); box-shadow: 0 10px 24px -12px rgba(240,165,42,.9); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); box-shadow: none; }
.btn.glass { background: rgba(255,255,255,.08); color: #eaf4ed; border-color: rgba(255,255,255,.18); box-shadow: none; }
.btn.warn { background: var(--warn); color: #fff; }
.btn.bad { background: transparent; border-color: var(--bad); color: var(--bad); box-shadow: none; }
.btn.big { padding: 12px 20px; font-size: 14.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 11px; cursor: pointer; font-size: 12.5px; border-radius: 8px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--canopy); color: #fff; }
.seg.dark { background: rgba(5,15,10,.6); border-color: rgba(255,255,255,.14); backdrop-filter: blur(8px); }
.seg.dark button { color: #b9cfc0; }
.seg.dark button[aria-pressed="true"] { background: #f0a52a; color: var(--ochre-ink); }

/* KPI tiles with 3D tilt */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; perspective: 900px; }
@media (max-width: 1150px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 6px; box-shadow: var(--shadow); transform-style: preserve-3d; transition: transform .18s ease-out, box-shadow .2s; overflow: hidden; min-width: 0; }
.kpi::after { content: ""; position: absolute; inset: 0; background: radial-gradient(300px 120px at var(--mx, 50%) var(--my, 0%), color-mix(in srgb, var(--ochre) 14%, transparent), transparent 70%); pointer-events: none; opacity: 0; transition: opacity .2s; }
.kpi:hover::after { opacity: 1; }
.kpi span { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
.kpi b { font-family: var(--font-num); font-size: 28px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 12px; color: var(--muted); }
.kpi.hl { background: linear-gradient(160deg, var(--ochre-soft), var(--surface)); border-color: color-mix(in srgb, var(--ochre) 55%, transparent); }
.kpi .ring { position: absolute; right: 12px; top: 12px; width: 46px; height: 46px; }
.kpi .ring circle { fill: none; stroke-width: 6; }
.kpi .ring .tr { stroke: var(--surface-2); }
.kpi .ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pipe button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 3px; cursor: pointer; position: relative; overflow: hidden; transition: transform .2s, border-color .2s; color: var(--ink); }
.pipe button:hover { transform: translateY(-2px); border-color: var(--canopy); }
.pipe b { font-family: var(--font-num); font-size: 26px; font-weight: 500; }
.pipe span { font-size: 12.5px; font-weight: 700; }
.pipe small { color: var(--muted); font-size: 12px; }
.pipe .bar { height: 4px; border-radius: 2px; margin-top: 6px; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }

/* charts */
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .tr { height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; display: flex; }
.hbar .tr div { height: 100%; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
.hbar .v { text-align: right; font-family: var(--font-num); font-size: 12.5px; }
.stack { display: flex; height: 22px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.stack div { height: 100%; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }

    const w = { id, demo: true, range: RANGE.name, name: s.name, beat: p.beat, scheme: p.scheme, year, treat: s.treat, estArea: p.est, estCost: p.cost, seedlings: p.seed || null,
      remarks: "Mock-drill example.", fileName: "example_" + (i + 1) + ".kml", geom: { type: "FeatureCollection", features }, result, verdict: vd.v, reasons: vd.reasons, s12: vd.s12, s45: vd.s45, sPE: vd.sPE, sOut: vd.sOut, matchPct: vd.matchPct,
      createdAt: iso(p.ago[0]), createdBy: ROLES.RFO.id, model: "FRPIM v2.2 (run 19 Nov 2026)", trail: [],
      rfoCert: { checks: RFO_CHECKS.map(() => true), smcSuit: p.smc[0], smcWorks: p.smc[1], water: p.smc[3], note: i === 4 ? "Gullies feeding the village tank; SMC will cut silt inflow." : "Boundary walked with GPS on the date of inspection.", at: iso(p.ago[1]), by: ROLES.RFO.id } };
    w.trail.push(mk("RFO", "Draft created", "KML " + w.fileName, p.ago[0]));
    w.trail.push(mk("RFO", "Certified and submitted to ACF", "FRPIM " + VERDICT[vd.v][0] + ", " + fp(vd.s12) + " in Phase 1-2 · SMC: " + p.smc[0] + " (" + p.smc[1].join(", ") + ")", p.ago[1]));
    const ok = ACF_CHECKS.map(() => true);
    if (p.stage === "APPROVED" || p.stage === "DCF") {
      w.acf = { checks: ok, inspected: i === 0, inspectedOn: i === 0 ? iso(p.ago[2] + 1) : null, remarks: "RFO certification checked. Phase 1-2 land; SMC works and rates in order.", at: iso(p.ago[2]), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Recommended to DCF", w.acf.remarks, p.ago[2]));
      if (p.stage === "APPROVED") { w.dcf = { decision: "Approved", remarks: "Approved. Take up SMC before the monsoon.", at: iso(p.ago[3]) }; w.trail.push(mk("DCF", "Approved by DCF", w.dcf.remarks, p.ago[3])); }
    }
    if (p.stage === "RET_RFO") {
      w.acf = { checks: [true, false, false], inspected: true, inspectedOn: iso(p.ago[2] + 1), remarks: "Most of the KML falls on excluded and protected land. Redraw the boundary on plantable blocks only.", at: iso(p.ago[2]), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Returned to RFO", w.acf.remarks, p.ago[2]));
    }
    if (p.stage === "APPROVED_DEV") {
      w.acf = { checks: ok, inspected: true, inspectedOn: iso(p.ago[2] + 1), remarks: "Low FRPIM priority, but SMC here protects the catchment of the village tank downstream. RFO's SMC assessment confirmed at site.", at: iso(p.ago[2]), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Recommended to DCF", w.acf.remarks, p.ago[2]));
      w.dcf = { decision: "Approved with recorded deviation", remarks: "Approved as catchment treatment for the village tank; deviation from FRPIM priority recorded.", at: iso(p.ago[3]) };
      w.trail.push(mk("DCF", "Approved by DCF with recorded deviation", w.dcf.remarks, p.ago[3]));
    }
    w.status = p.stage; w.updatedAt = w.trail[w.trail.length - 1].at;
    await Store.put(w);
  }
  toast("Mock-drill examples loaded"); go({ v: "dash" });
}

/* ---------------- boot ---------------- */
async function boot() {
  ROLE = ss.get("frpim_role"); if (ROLE && !ROLES[ROLE]) ROLE = null;
  try { await loadBlocks(); } catch (e) { /* shown below */ }
  render();
  Store.on(() => { if (!ROLE) return; const typing = document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName);
    if (VIEW.v === "new" || VIEW.v === "map" || typing) return; render(); });
  await Store.init();
  if (!BLOCKS.length) { $("#app").prepend(el("div", { class: "banner r gut", text: "The FRPIM blocks could not be loaded. Reload the page." })); return; }
  render();
}
window.addEventListener("resize", () => placePill());
if (window.L && window.turf) boot(); else window.addEventListener("load", () => { if (window.L && window.turf) boot(); else $("#app").textContent = "The map libraries could not be loaded. Check the internet connection and reload."; });
</script>

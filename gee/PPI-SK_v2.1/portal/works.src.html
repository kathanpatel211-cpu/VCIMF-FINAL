<style>
/*LEAFLET_CSS*/
/* Layout: an office workflow portal. Green top bar with role and navigation; content column of cards; a work file opens as one page with the map panel, FRPIM findings, scrutiny and the action box. */
:root {
  --bg: #f2f5f1; --surface: #ffffff; --surface-2: #edf2ec; --ink: #16211a; --muted: #5b6b60; --line: #d6ded7;
  --brand: #17462c; --brand-2: #1f5f3a; --brand-ink: #ffffff; --accent: #b86e00; --accent-soft: #fdf0dc;
  --soft: #e1eee5; --mapbg: #e8ede7;
  --ok: #1a7f37; --ok-soft: #e1f2e6; --warn: #a15c07; --warn-soft: #fbeed6; --bad: #b42318; --bad-soft: #fbe3e0;
  --info: #1d5fa8; --info-soft: #e2edf9;
  --font-ui: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(20, 40, 28, .06), 0 2px 8px rgba(20, 40, 28, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111714; --surface: #18201b; --surface-2: #1f2923; --ink: #e5ece7; --muted: #9aab9f; --line: #2d3a32;
  --brand: #0f2a1b; --brand-2: #1c4a2f; --brand-ink: #eaf3ec; --accent: #e7a54a; --accent-soft: #3a2a13;
  --soft: #1d3326; --mapbg: #1b231e;
  --ok: #5cc27a; --ok-soft: #16301f; --warn: #e3a34a; --warn-soft: #382913; --bad: #f07a6c; --bad-soft: #3b1b18;
  --info: #7fb2ec; --info-soft: #172739; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111714; --surface: #18201b; --surface-2: #1f2923; --ink: #e5ece7; --muted: #9aab9f; --line: #2d3a32;
  --brand: #0f2a1b; --brand-2: #1c4a2f; --brand-ink: #eaf3ec; --accent: #e7a54a; --accent-soft: #3a2a13;
  --soft: #1d3326; --mapbg: #1b231e;
  --ok: #5cc27a; --ok-soft: #16301f; --warn: #e3a34a; --warn-soft: #382913; --bad: #f07a6c; --bad-soft: #3b1b18;
  --info: #7fb2ec; --info-soft: #172739; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- login ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
@media (max-width: 860px) { .login { grid-template-columns: minmax(0, 1fr); } }
.login .brandside { background: var(--brand); color: var(--brand-ink); padding-block: 48px; display: grid; align-content: space-between; gap: 32px; position: relative; overflow: hidden; }
.login .brandside canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; }
.login .brandside > * { position: relative; }
.login .mark { display: flex; gap: 12px; align-items: center; font-weight: 700; letter-spacing: .02em; }
.login .mark i { width: 38px; height: 38px; border-radius: 9px; background: var(--brand-ink); display: grid; place-items: center; }
.login .brandside h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.02em; max-width: 14ch; }
.login .brandside p { max-width: 46ch; opacity: .85; font-size: 15px; }
.login .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.login .flow span { background: rgba(255,255,255,.12); padding: 5px 10px; border-radius: 999px; }
.login .formside { padding-block: 48px; display: grid; align-content: center; justify-items: center; }
.login .box { width: 100%; max-width: 420px; display: grid; gap: 16px; }
.login .box h2 { font-size: 22px; }
.rolecards { display: grid; gap: 8px; }
.rolecard { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.rolecard:hover { border-color: var(--brand-2); }
.rolecard[aria-pressed="true"] { border-color: var(--brand-2); box-shadow: 0 0 0 2px var(--soft); }
.rolecard .av { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; }
.rolecard b { display: block; }
.rolecard small { color: var(--muted); }
.rolecard code { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.field { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { font-weight: 400; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; width: 100%; min-width: 0; }
.field textarea { min-height: 74px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); font-size: 13px; }
.okm { color: var(--ok); font-size: 13px; }

/* ---------- app shell ---------- */
.top { background: var(--brand); color: var(--brand-ink); position: sticky; top: 0; z-index: 1000; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--brand); z-index: 1001; }
.top .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding-block: 10px; }
.top .title { display: flex; gap: 10px; align-items: center; min-width: 0; }
.top .title i { width: 30px; height: 30px; border-radius: 7px; background: var(--brand-ink); display: grid; place-items: center; flex: none; }
.top .title b { font-size: 15px; display: block; }
.top .title small { opacity: .75; font-size: 12px; display: block; }
.who { display: flex; gap: 10px; align-items: center; }
.who .av { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff; border: 1px solid rgba(255,255,255,.35); }
.who b { display: block; font-size: 13px; }
.who small { opacity: .75; font-size: 11.5px; }
.top button.out { background: transparent; border: 1px solid rgba(255,255,255,.4); color: var(--brand-ink); border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.nav { display: flex; gap: 2px; overflow-x: auto; background: var(--brand-2); }
.nav button { background: transparent; border: 0; color: var(--brand-ink); opacity: .8; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav button[aria-current="page"] { opacity: 1; border-bottom-color: var(--accent); }
.nav .count { background: var(--accent); color: #1b1203; border-radius: 999px; padding: 0 7px; font-size: 11.5px; margin-left: 6px; }
main { padding-block: 18px 40px; display: grid; gap: 16px; max-width: 1360px; margin: 0 auto; }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.pagehead h1 { font-size: 22px; letter-spacing: -0.01em; }
.pagehead p { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card > h2 { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card > h2 small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 980px) { .g2, .g3, .g-main { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 4px; box-shadow: var(--shadow); }
.kpi span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.kpi b { font-family: var(--font-num); font-size: 26px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 12px; color: var(--muted); }
.kpi.hl { border-color: var(--accent); background: var(--accent-soft); }

.btn { border: 1px solid var(--brand-2); background: var(--brand-2); color: var(--brand-ink); border-radius: 7px; padding: 9px 15px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn.ghost { background: transparent; color: var(--brand-2); }
.btn.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
.btn.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.big { padding: 11px 18px; font-size: 14.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:root:not([data-theme="light"]) .btn.ghost { color: var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.c-g { background: var(--ok-soft); color: var(--ok); } .c-a { background: var(--warn-soft); color: var(--warn); } .c-r { background: var(--bad-soft); color: var(--bad); }
.c-i { background: var(--info-soft); color: var(--info); } .c-s { background: var(--surface-2); color: var(--muted); } .c-x { background: var(--accent-soft); color: var(--accent); }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 720px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pipe button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 10px 12px; display: grid; gap: 2px; cursor: pointer; position: relative; }
.pipe button:hover { border-color: var(--brand-2); }
.pipe b { font-family: var(--font-num); font-size: 22px; font-weight: 500; }
.pipe span { font-size: 12.5px; font-weight: 600; }
.pipe small { color: var(--muted); font-size: 12px; }
.pipe .bar { height: 4px; border-radius: 2px; margin-top: 4px; }

/* charts */
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .tr { height: 14px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.hbar .tr div { height: 100%; }
.hbar .v { text-align: right; font-family: var(--font-num); font-size: 12.5px; }
.stack { display: flex; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.stack div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; border: 1px solid rgba(0,0,0,.2); }

/* lists */
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px 10px 0; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.item:hover { border-color: var(--brand-2); }
.item .st { align-self: stretch; border-radius: 9px 0 0 9px; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.item .m { font-size: 12.5px; color: var(--muted); }
.item .r { display: grid; gap: 4px; justify-items: end; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty b { color: var(--ink); }
.feed { display: grid; gap: 10px; }
.feed > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.feed .av { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 11px; color: #fff; }
.feed small { color: var(--muted); display: block; }

/* tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; }
table.t td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: middle; }
table.t td.n, table.t th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t i.sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; margin-right: 7px; border: 1px solid rgba(0,0,0,.2); vertical-align: -1px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters select, .filters input { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); min-width: 0; }
.filters input { flex: 1 1 200px; }

/* work file */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; counter-reset: s; }
.steps div { position: relative; padding: 0 8px 0 0; display: grid; gap: 4px; font-size: 12.5px; }
.steps div::before { content: ""; height: 6px; border-radius: 3px; background: var(--surface-2); }
.steps div.done::before { background: var(--ok); }
.steps div.now::before { background: var(--accent); }
.steps div.back::before { background: var(--bad); }
.steps b { font-size: 13px; }
.steps small { color: var(--muted); }
@media (max-width: 560px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 10px; } }
.maps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .maps3 { grid-template-columns: minmax(0, 1fr); } }
.maps3 figure { margin: 0; display: grid; gap: 6px; }
.maps3 figcaption { font-size: 12.5px; font-weight: 700; }
.maps3 svg { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--mapbg); display: block; }
.maps3 .legend { font-size: 11px; }
.verdict { border-radius: 9px; padding: 12px 14px; border-left: 6px solid; display: grid; gap: 4px; }
.verdict.g { background: var(--ok-soft); border-color: var(--ok); } .verdict.a { background: var(--warn-soft); border-color: var(--warn); } .verdict.r { background: var(--bad-soft); border-color: var(--bad); }
.verdict b { font-size: 16px; }
.verdict.g b { color: var(--ok); } .verdict.a b { color: var(--warn); } .verdict.r b { color: var(--bad); }
.verdict ul { margin: 2px 0 0; padding-left: 18px; font-size: 13px; }
.mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .mini { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mini div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.mini b { font-family: var(--font-num); font-size: 18px; font-weight: 500; }
.mini span { font-size: 11.5px; color: var(--muted); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.timeline { display: grid; gap: 0; }
.timeline > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; font-size: 13px; }
.timeline > div::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
.timeline > div:last-child::after { display: none; }
.timeline .av { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 11px; color: #fff; z-index: 1; }
.timeline small { color: var(--muted); display: block; }
.timeline q { display: block; margin-top: 3px; color: var(--ink); background: var(--surface-2); padding: 6px 9px; border-radius: 6px; quotes: none; }
.action { border: 2px solid var(--accent); background: var(--accent-soft); }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; cursor: pointer; }
.checks input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--brand-2); }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; display: grid; gap: 6px; background: var(--surface-2); cursor: pointer; }
.drop.over { border-color: var(--brand-2); background: var(--soft); }
.drop b { font-size: 15px; }
.formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.formgrid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .formgrid { grid-template-columns: minmax(0, 1fr); } }
.banner { border-radius: 9px; padding: 10px 14px; font-size: 13.5px; }
.banner.r { background: var(--bad-soft); color: var(--ink); border-left: 5px solid var(--bad); }
.banner.i { background: var(--info-soft); border-left: 5px solid var(--info); }
#bigmap { height: min(70vh, 680px); min-height: 380px; border: 1px solid var(--line); border-radius: 10px; background: var(--mapbg); }
.leaflet-container { background: var(--mapbg); font-family: var(--font-ui); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--brand-2); color: var(--brand-ink); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13.5px; z-index: 2000; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-block: 6px 24px; }
details > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app" aria-live="polite"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
"use strict";
/* =====================================================================
   FRPIM Restoration Works Portal: RFO -> ACF -> DCF approval workflow
   with every treatment map checked against FRPIM Maps 1-3.
   ===================================================================== */
const RANGE = { code: "KB", name: "Khedbrahma Range" };
const ROLES = {
  RFO: { id: "rfo.khedbrahma", title: "Range Forest Officer", office: "Khedbrahma Range", colour: "#1f5f3a", can: "Prepares proposals and uploads treatment KMLs" },
  ACF: { id: "acf.khedbrahma", title: "Assistant Conservator of Forests", office: "Khedbrahma Sub-division", colour: "#1d5fa8", can: "Scrutinises proposals and recommends them to the DCF" },
  DCF: { id: "dcf.division", title: "Deputy Conservator of Forests", office: "Forest Division", colour: "#8a4b00", can: "Final approval authority" }
};
const DEMO_PASSWORD = "demo@123";
const STATUS = {
  DRAFT: ["Draft", "c-s"], ACF: ["With ACF for scrutiny", "c-i"], RET_RFO: ["Returned to RFO", "c-r"], DCF: ["With DCF for approval", "c-x"],
  RET_ACF: ["Returned to ACF", "c-r"], APPROVED: ["Approved", "c-g"], APPROVED_DEV: ["Approved with recorded deviation", "c-g"], REJECTED: ["Not approved", "c-r"]
};

      el("div", { class: "hint", text: "Areas are measured on the 829 FRPIM blocks of 10 ha (model run 19 Nov 2026). The check also compares the proposed treatment with FRPIM's recommendation and the estimate area with the KML area." })),
    el("div", { class: "card" }, el("h2", { text: "Mock-drill accounts" }), el("table", { class: "t" }, el("tbody", null, Object.entries(ROLES).map(([k, r]) => el("tr", null, el("td", null, avatar(k)), el("td", null, el("b", { text: r.title }), el("div", { class: "hint", text: r.office })), el("td", { class: "num", text: r.id }))))),
      el("div", { class: "hint", text: "Password for all three: " + DEMO_PASSWORD + ". These accounts show the workflow; they are not a security system." }),

async function exportCSV(list) {
  const dl = await useCap("downloads"); if (!dl) { toast("Saving files is not available in this view"); return; }
  const cols = ["Work ID", "Name", "Beat", "Scheme", "Year", "Treatment", "Estimate ha", "KML ha", "Phase 1-2 %", "Phase 4-5 %", "Protected/Excluded %", "Treatment agrees %", "FRPIM check", "Status", "Mean RNI", "Mean RFI", "Cost lakh", "Seedlings", "Proposed on", "Last action", "Last action on"];
  const q = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = list.map((w) => { const l = (w.trail || []).slice(-1)[0] || {};
    return [dispId(w.id), w.name, w.beat, w.scheme, w.year, TREAT[w.treat], w.estArea, w.result.total.toFixed(2), w.s12, w.s45, w.sPE, w.matchPct, VERDICT[w.verdict][0], STATUS[w.status][0], w.result.rni, w.result.rfi, w.estCost, w.seedlings, dd(w.createdAt), l.action, l.at ? dd(l.at) : ""].map(q).join(","); });
  const csv = "﻿" + cols.join(",") + "\n" + rows.join("\n") + "\n";
  try { await dl.save({ filename: "FRPIM_works_register_" + new Date().toISOString().slice(0, 10) + ".csv", data: new Blob([csv], { type: "text/csv" }) }); toast("Register saved"); } catch (e) { toast("The file was not saved"); }
}

/* ---------------- mock-drill examples ---------------- */
async function loadDemo() {
  if (Store.all().some((w) => w.demo)) { toast("The mock-drill examples are already loaded"); return; }
  const year = fyNow(), now = Date.now(), day = 864e5;
  const plan = [
    { stage: "APPROVED", scheme: "CAMPA", est: 17, cost: 9.8, seed: 18700, beat: "Compt. A", ago: [24, 21, 15, 9] },
    { stage: "DCF", scheme: "State plan", est: 16.5, cost: 8.6, seed: 18150, beat: "Compt. B", ago: [12, 10, 4] },
    { stage: "ACF", scheme: "CAMPA", est: 20, cost: 7.2, seed: 9900, beat: "Compt. C", ago: [5, 3] },
    { stage: "RET_RFO", scheme: "MGNREGA", est: 21, cost: 11.4, seed: 23100, beat: "Compt. D", ago: [9, 8, 2] },
    { stage: "APPROVED_DEV", scheme: "MGNREGA", est: 20, cost: 6.1, seed: 0, beat: "Compt. E", ago: [30, 27, 22, 18] }
  ];
  const mk = (role, action, note, d) => ({ at: new Date(now - d * day).toISOString(), role, user: ROLES[role].id, action, note });
  for (let i = 0; i < SAMPLES.length && i < plan.length; i++) {
    const s = SAMPLES[i], p = plan[i];
    const features = [{ type: "Feature", properties: { name: s.name }, geometry: { type: "Polygon", coordinates: [s.coords] } }];
    const result = analyse(features), vd = verdictOf(result, s.treat, p.est);
    const pre = RANGE.code + "-" + year + "-", id = pre + String(901 + i);
    const w = { id, demo: true, range: RANGE.name, name: s.name, beat: p.beat, scheme: p.scheme, year, treat: s.treat, estArea: p.est, estCost: p.cost, seedlings: p.seed || null,
      remarks: "Mock-drill example.", fileName: "example_" + (i + 1) + ".kml", geom: { type: "FeatureCollection", features }, result, verdict: vd.v, reasons: vd.reasons, s12: vd.s12, s45: vd.s45, sPE: vd.sPE, sOut: vd.sOut, matchPct: vd.matchPct,
      createdAt: new Date(now - p.ago[0] * day).toISOString(), createdBy: ROLES.RFO.id, model: "FRPIM v2.2 (run 19 Nov 2026)", trail: [] };
    w.trail.push(mk("RFO", "Draft created", "KML " + w.fileName, p.ago[0]));
    w.trail.push(mk("RFO", "Submitted to ACF", "FRPIM check " + VERDICT[vd.v][0] + ", " + fp(vd.s12) + " in Phase 1-2", p.ago[1]));
    const allOk = CHECKLIST.map(() => true);
    if (p.stage === "APPROVED" || p.stage === "DCF") {
      w.acf = { checks: allOk, remarks: "Site inspected. Boundary and area verified; Phase 1-2 land with SMC needed.", at: new Date(now - p.ago[2] * day).toISOString(), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Recommended to DCF", w.acf.remarks, p.ago[2]));
      if (p.stage === "APPROVED") { w.dcf = { decision: "Approved", remarks: "Approved. Take up SMC before the monsoon.", at: new Date(now - p.ago[3] * day).toISOString() }; w.trail.push(mk("DCF", "Approved by DCF", w.dcf.remarks, p.ago[3])); }
    }
    if (p.stage === "RET_RFO") {
      w.acf = { checks: [true, true, true, false, false, false], remarks: "Most of the KML falls on excluded and protected land. Redraw the boundary on plantable blocks only.", at: new Date(now - p.ago[2] * day).toISOString(), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Returned to RFO", w.acf.remarks, p.ago[2]));
    }
    if (p.stage === "APPROVED_DEV") {
      w.acf = { checks: allOk, remarks: "Low FRPIM priority, but SMC here protects the catchment of the village tank downstream.", at: new Date(now - p.ago[2] * day).toISOString(), by: ROLES.ACF.id };
      w.trail.push(mk("ACF", "Recommended to DCF", w.acf.remarks, p.ago[2]));
      w.dcf = { decision: "Approved with recorded deviation", remarks: "Approved as catchment treatment for the village tank; deviation from FRPIM priority recorded.", at: new Date(now - p.ago[3] * day).toISOString() };
      w.trail.push(mk("DCF", "Approved by DCF with recorded deviation", w.dcf.remarks, p.ago[3]));
    }
    w.status = p.stage; w.updatedAt = w.trail[w.trail.length - 1].at;
    await Store.put(w);
  }
  toast("Mock-drill examples loaded"); go({ v: "dash" });
}

/* ---------------- boot ---------------- */
async function boot() {
  ROLE = ss.get("frpim_role"); if (ROLE && !ROLES[ROLE]) ROLE = null;
  render();
  Store.on(() => { if (ROLE && !["new"].includes(VIEW.v) && !(VIEW.v === "work" && document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) && VIEW.v !== "map") render(); });
  try { await loadBlocks(); } catch (e) { $("#app").prepend(el("div", { class: "banner r gut", text: "The FRPIM blocks could not be loaded. Reload the page." })); }
  await Store.init();
  render();
}
window.addEventListener("resize", () => { if (!ROLE) drawContours(); });
if (window.L && window.turf) boot(); else window.addEventListener("load", () => { if (window.L && window.turf) boot(); else $("#app").textContent = "The map libraries could not be loaded. Check the internet connection and reload."; });
</script>
